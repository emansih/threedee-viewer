product:
  type: kmp/lib
  platforms: [ jvm, android, wasmJs ]

aliases:
  # SceneView's Compose viewer ships Android and desktop variants only; web uses sceneview.js
  - sceneView: [ jvm, android ]
  # Platforms whose images are decoded and encoded with Skia
  - skiko: [ jvm, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kotlinx.serialization.json
  - $libs.filekit.dialogs.compose

dependencies@sceneView:
  - $libs.sceneview.compose

dependencies@android:
  - $compose.uiTooling

test-dependencies:
  - $kotlin.test

settings:
  kotlin:
    serialization: enabled
  compose:
    enabled: true
    resources:
      packageName: com.hisname.productrender.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
